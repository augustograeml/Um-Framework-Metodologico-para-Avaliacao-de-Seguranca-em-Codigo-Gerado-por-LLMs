<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Analysis Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    {% extends 'base.html' %}

    {% block content %}
    <h1>Search Results</h1>
    {% if results %}
        <ul>
            {% for entry in results %}
                <li>
                    <strong>{{ entry.timestamp }}</strong> [{{ entry.level }}]: {{ entry.message }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No results found for your search term.</p>
    {% endif %}
    <a href="{{ url_for('index') }}">Back to Search</a>
    {% endblock %}
</body>
</html>
